name: Android14 GKI Kernel 6.1.57

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - android14-6.1

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ARCH: arm64
      SUBARCH: arm64
      OUT_DIR: out
      DEFCONFIG: peridot_defconfig
      CLANG_VERSION: r487747

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      # ====== SPACE CHECK & CLEANUP ======
      - name: Force uninstall KernelSU (safe)
        run: |
          set +e
          echo "== KernelSU auto-uninstall =="

          rm -rf drivers/kernelsu

          if [ -f drivers/Kconfig ]; then
            sed -i '/kernelsu/d' drivers/Kconfig
          fi

          if [ -f drivers/Makefile ]; then
            sed -i '/kernelsu/d' drivers/Makefile
          fi

          if [ -f Makefile ]; then
            sed -i '/kernelsu/d' Makefile
          fi

          find . -type f \( -name "Kconfig" -o -name "Makefile" \) \
            -exec sed -i '/kernelsu/d' {} +

          echo "KernelSU uninstall step finished"

      - name: Check space before cleanup
        run: |
          echo "Free space before cleanup:"
          df -h
          sudo chown runner /mnt

      - name: Cleanup
        run: |
          docker images
          sudo rm -rf "/home/work/*" || true
          sudo rm -rf "/opt/*" || true
          sudo rm -rf "/usr/share/dotnet" || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
          sudo rm -rf "/usr/local/lib/android" || true
          sudo rm -rf "/usr/local/share/boost" || true
          sudo rm -rf "/usr/lib/jvm" || true
          sudo rm -rf "/usr/share/swift" || true
          sudo rm -rf "/usr/local/julia*" || true
          sudo rm -rf "/usr/share/kotlinc" || true
          sudo rm -rf "/usr/local/share/edge_driver" || true
          sudo rm -rf "/usr/local/share/chromedriver-linux64" || true
          sudo rm -rf "/usr/local/share/gecko_driver" || true
          sudo rm -rf "/usr/share/miniconda" || true
          sudo rm -rf "/usr/local/share/phantomjs*" || true
          sudo rm -rf "/usr/share/sbt" || true
          sudo rm -rf "/usr/local/sqlpackage" || true
          sudo rm -rf "/usr/bin/yq" || true
          sudo rm -rf "/usr/local/share/vcpkg" || true
          sudo rm -rf "/usr/local/bin/"{terraform,stack,aliyun,pulumi,azcopy,bicep,rebar3,packer,docker-compose,minikube,kustomize,kubectl,kind,helm} || true
          sudo rm -rf "/home/.dotnet" "/etc/skel/.dotnet" "/home/linuxbrew" "/home/.nvm" || true
          sudo docker image prune -a -f || true
          rustup self uninstall -y || true

          sudo apt purge -y \
            clang* llvm* node* npm* ruby* php* dotnet-sdk* \
            google-chrome-stable firefox powershell mono-complete \
            docker-* podman buildah skopeo kubectl \
            mysql* postgresql* mongodb* nginx apache2 \
            openjdk-* temurin-* \
            gcc-* g++-* \
            linux-headers-* \
            python3-* \
            man-db manpages \
            '*-dev' || true

          sudo apt-get autoremove -y || true
          sudo apt-get autoclean -y || true
          df -h

      # ====== DEPENDENCIES ======
      - name: Install minimal build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            bc \
            bison \
            build-essential \
            curl \
            flex \
            git \
            libelf-dev \
            libssl-dev \
            lld \
            python3 \
            unzip \
            zip

      # ====== TOOLCHAIN ======
      - name: Clone AOSP Clang
        run: |
          mkdir -p toolchains
          cd toolchains

          git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            --depth 1 \
            --single-branch \
            -b main

          CLANG_DIR=$(ls -d linux-x86/clang-r*/bin | sort -V | tail -n 1 | xargs dirname)
          echo "CLANG_PATH=$PWD/$CLANG_DIR/bin" >> $GITHUB_ENV

      - name: Setup LLVM environment
        run: |
          echo "PATH=${CLANG_PATH}:$PATH" >> $GITHUB_ENV
          echo "CC=clang" >> $GITHUB_ENV
          echo "LD=ld.lld" >> $GITHUB_ENV
          echo "AR=llvm-ar" >> $GITHUB_ENV
          echo "NM=llvm-nm" >> $GITHUB_ENV
          echo "OBJCOPY=llvm-objcopy" >> $GITHUB_ENV
          echo "OBJDUMP=llvm-objdump" >> $GITHUB_ENV
          echo "STRIP=llvm-strip" >> $GITHUB_ENV
          echo "LLVM=1" >> $GITHUB_ENV
          echo "LLVM_IAS=1" >> $GITHUB_ENV

      # ====== BUILD ======
      - name: Kernel defconfig + merge pineapple configs
        run: |
          make clean && make mrproper
          mkdir -p ${OUT_DIR}
          rm -f .config

          # Base defconfig
          make O=${OUT_DIR} ARCH=arm64 ${DEFCONFIG}

          export KCONFIG_CONFIG=out/.config

          # Merge vendor configs (Snapdragon 8 Gen 3)
          scripts/kconfig/merge_config.sh -m \
           out/.config \
           arch/arm64/configs/vendor/pineapple_GKI.config 

          make O=out ARCH=arm64 olddefconfig

      - name: Build GKI kernel
        run: |
          make O=${OUT_DIR} ARCH=arm64 -j$(nproc)

      # ====== ARTIFACT ======
      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp ${OUT_DIR}/arch/arm64/boot/Image artifacts/ || true
          cp ${OUT_DIR}/arch/arm64/boot/Image.lz4 artifacts/ || true
          cp ${OUT_DIR}/drivers/regulator/rpmh-regulator.ko artifacts/ || true
          cp ${OUT_DIR}/drivers/power/supply/qti_battery_charger.ko artifacts/ || true
          cp ${OUT_DIR}/drivers/thermal/qcom/qcom_tsens.ko artifacts/ || true
          cp ${OUT_DIR}/drivers/cpufreq/qcom-cpufreq-hw.ko artifacts/ || true
          cp ${OUT_DIR}/drivers/clk/qcom/clk-qcom.ko artifacts/ || true
          cp ${OUT_DIR}/drivers/soc/qcom/dcvs/qcom-dcvs.ko artifacts/ || true
        



      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android14-gki-6.1.57
          path: artifacts
